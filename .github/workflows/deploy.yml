name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 允许推送 gh-pages 分支

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    # 跑在本机自托管 runner 上（~/actions-runner/website-runner）
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本机 node 由 nvm 安装，runner 默认 PATH 里没有，显式加入
      - name: Use local Node (nvm)
        run: |
          NODE_DIR=$(ls -d "$HOME/.nvm/versions/node/"v* 2>/dev/null | sort -V | tail -1)
          echo "Node: $NODE_DIR"
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 把构建产物作为孤儿分支强制推到 gh-pages，Pages 从该分支发布
      - name: Publish dist to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish: $(date '+%Y-%m-%d %H:%M')"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published ✓"
