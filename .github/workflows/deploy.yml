name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消排队中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 跑在本机自托管 runner 上（~/actions-runner/website-runner）
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本机 node 由 nvm 安装，runner 默认 PATH 里没有，显式加入
      - name: Use local Node (nvm)
        run: |
          NODE_DIR=$(ls -d "$HOME/.nvm/versions/node/"v* 2>/dev/null | sort -V | tail -1)
          echo "Node: $NODE_DIR"
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
